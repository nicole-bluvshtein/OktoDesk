[project]
name = "oktodesk"
version = "0.2.0"
description = "OktoDesk — internal IT-support ticketing system"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["oktodesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
